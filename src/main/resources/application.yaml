quarkus:
  http:
    port: 8080
  log:
    category:
      "com.example.adapter":
        level: INFO

adapter:
  excel:
    source: orchestrator.xlsx
    routes-sheet: routes
    steps-sheet: steps
    transforms-sheet: transforms
    aggregates-sheet: aggregates
  execution:
    mock-enabled: false
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
